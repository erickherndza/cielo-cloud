# App Platform — API de Cielo Cloud. Ningún secreto va en este archivo.
name: cielo-cloud
region: nyc
services:
  - name: api
    github:
      repo: erickherndza/cielo-cloud
      branch: feat/digitalocean-postgres
      deploy_on_push: false
    source_dir: /server
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: FIREBASE_PROJECT_ID
        value: cielo-nomina-prueba
      - key: ALLOWED_ORIGINS
        value: https://cielo-nomina-prueba.web.app
      # Se enlazan al clúster gestionado con el usuario sin privilegios
      # cielo_app: no hay que pegar ninguna contraseña a mano.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
databases:
  - name: db
    engine: PG
    production: true
    cluster_name: cielo-cloud-db
    db_name: defaultdb
    db_user: cielo_app

# App Platform — API de Cielo Cloud. Los secretos NO van aquí: se pegan en el
# panel de DigitalOcean (App → Settings → Environment Variables).
name: cielo-cloud
region: nyc
services:
  - name: api
    github:
      repo: erickherndza/cielo-cloud
      branch: feat/digitalocean-postgres
      deploy_on_push: false
    source_dir: /server
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /health
    envs:
      - key: FIREBASE_PROJECT_ID
        value: cielo-nomina-prueba
      - key: ALLOWED_ORIGINS
        value: https://cielo-nomina-prueba.web.app
      - key: DATABASE_URL
        type: SECRET
      - key: DATABASE_CA_CERT
        type: SECRET
